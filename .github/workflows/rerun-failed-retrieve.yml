name: Re-run Failed Retrieve

# Re-runs the failed jobs of a Retrieve Data run, which is how a failed run is
# recovered by hand - automated, because by hand it waits for someone to see it.
#
# It exists for the failures a fresh runner fixes and the step's own retries
# can't. On GitHub's runners those are mostly a venue's firewall dropping one
# VM's IP: every connection to the venue times out (UND_ERR_CONNECT_TIMEOUT)
# for as long as the job runs - Olympic Studios ran four attempts five minutes
# apart over 18 minutes without one connecting - while the other venues in the
# same job retrieve fine, and a re-run, on a new VM, passes first time. More
# attempts or longer waits inside the job only spend longer on the same IP.
#
# This doesn't relax the release gate. Create Release still needs every
# retrieve job to pass, and a re-run is the same run with the same gate; a
# re-run of failed jobs also re-runs Create Release, which was skipped. What a
# re-run can't fix is left for a human:
#
# - A failed Create Release isn't retried here. Its own step already retries
#   the upload once, and re-running it would cut a new timestamped release
#   beside the draft the failure left behind, which needs looking at first.
# - Two automatic re-runs at most (attempts 2 and 3). A venue still failing on
#   the third runner is a venue that needs looking at.

on:
  # zizmor: ignore[dangerous-triggers] - Retrieve Data is workflow_dispatch
  # only, so no fork or pull request can start the run this follows, and this
  # job checks out and runs no code: it reads the run's jobs and re-runs them.
  workflow_run:
    workflows: ["Retrieve Data"]
    types: [completed]

permissions: {}

concurrency:
  group: rerun-failed-retrieve-${{ github.event.workflow_run.id }}

jobs:
  rerun:
    name: Re-run failed jobs
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    permissions:
      actions: write # to read the run's jobs and re-run the failed ones
    steps:
      - name: Re-run failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          failed=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs \
            --jq '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped") | .name]')
          echo "Attempt $RUN_ATTEMPT of run $RUN_ID failed: $failed"

          if jq -e 'index("Create Release") != null' <<< "$failed" > /dev/null; then
            echo "::warning::Create Release failed - not re-running; check for a draft release left behind."
            exit 0
          fi

          # A pause before going again, for the self-hosted jobs: they share one
          # public IP, so an immediate re-run meets the same refusal. GitHub's
          # runners get a new VM either way.
          sleep 120

          gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
          echo "🔁 Re-ran failed jobs of ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID} ($failed)" >> "$GITHUB_STEP_SUMMARY"
